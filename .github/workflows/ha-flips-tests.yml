name: HA Flips unit tests

on:
  push:
    branches:
      - futures-paper-architecture
  pull_request:
    branches:
      - futures-paper-architecture

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run HA Flips unit tests
        run: python -m unittest discover -s tests -t . -p "test_ha_flips.py" -v
